<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bootstrap Cards</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
<h2 class="text-center mb-4">Bootstrap Cards</h2>
<div class="row">
<!-- Card 1 -->
<div class="col-md-4">
<div class="card">
<img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Image">
<div class="card-body">
<h5 class="card-title">Card 1</h5>
<p class="card-text">There's some simple content inside the first card.</p>
<a href="#" class="btn btn-primary">Read More</a>
</div>
</div>
</div>
<!-- Card 2 -->
<div class="col-md-4">
<div class="card">
<img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Image">
<div class="card-body">
<h5 class="card-title">Card 2</h5>
<p class="card-text">There's some simple content inside the second card.</p>
<a href="#" class="btn btn-success">Learn More</a>
</div>
</div>
</div>
<!-- Card 3 -->
<div class="col-md-4">
<div class="card">
<img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Image">
<div class="card-body">
<h5 class="card-title">Card 3</h5>
<p class="card-text">There's some simple content inside the third card.</p>
<a href="#" class="btn btn-danger">View Details</a>
</div>
</div>
</div>
</div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
